project_id = "jovem-suppliers"

[auth]
enable_signup = true
minimum_password_length = 10
password_requirements = "letters_digits"
# Para produção no Supabase Cloud, isto deve ser configurado no Dashboard
site_url = "http://jovem-suppliers.vercel.app"
additional_redirect_urls = [
  "http://jovem-suppliers.vercel.app/entrar",
  "http://jovem-suppliers.vercel.app/redefinir-palavra-passe"
]

[auth.email]
enable_confirmations = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30